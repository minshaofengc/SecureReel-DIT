# electron-builder 打包配置
#
# 这是"能跑"和"能给别人装"之间的那一层。没有这个文件时，
# electron-builder 会用一堆默认值：应用标识是 com.electron.*、
# 图标用 Electron 自己的、而且只打当前机器的架构。
#
# 两个平台都从这一个文件出包：
#   npm run dist:mac   → dmg + zip（universal）
#   npm run dist:win   → NSIS 安装程序 + 免安装单文件 + 免安装 zip（x64）
# 产物目录由各自的脚本指到工作区根（2026-10-04 重排后源码在 01-源码/ 里，
# 工作区根 = 源码根的上两层）：
#   mac     → 02-Mac 版/     （scripts/dist-mac.sh）
#   Windows → 03-Windows 版/ （scripts/dist-win.sh）

# appId 与 productName 都带上 "2"：
# 装进「应用程序」时不与 1.x 互相顶掉，两版可以共存（boss 的明确要求）。
# 若这里改回原名，macOS 会把 2.0 当成 1.x 的升级版直接覆盖安装。
appId: com.shanfly.securereel-dit2
productName: SecureReel DIT 2
copyright: Copyright © 2026 Shanfly

directories:
  output: dist
  buildResources: build

# 打进 app.asar 的内容。生产依赖（hash-wasm / zod）由 electron-builder
# 自动带上，这里只声明应用自身的产物。
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# ⚠️ 随包分发的 ffmpeg / ffprobe **不能**放在这里（全局段）。
#
# 全局 extraResources 与平台段的是**相加**关系（app-builder-lib 的
# fileMatcher.js 把两处都加进同一份列表），所以留在这里就等于：
# 打 Windows 包时也会执行下面的 `vendor/ffmpeg/${arch}`，而交叉打包时
# `${arch}` 解析成 `x64` —— 结果是把 macOS 的 Mach-O 二进制塞进 Windows 包，
# 装完读不到任何时长与分辨率。两边各写各的才不会串。
#
# 许可与声明是两个平台都要的，所以留在全局段。
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: node_modules/electron/LICENSE
    to: LICENSES/electron.txt
  # FFmpeg 是 LGPL：许可全文必须随包分发（两个平台用的版本不同，两份都带）
  - from: build/licenses/LGPL-2.1.txt
    to: LICENSES/LGPL-2.1.txt
  - from: build/licenses/LGPL-3.0.txt
    to: LICENSES/LGPL-3.0.txt

mac:
  category: public.app-category.video
  icon: build/icon.png
  # 与 README 声明的 macOS 13+ 保持一致
  minimumSystemVersion: '13.0'
  # universal = 一份安装包同时支持 Apple 芯片与 Intel 芯片。
  # 影视行业还有大量 Intel 的 Mac Pro 在工作，只打 arm64 会让这些人装不上。
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # 没有开发者证书时不尝试签名，避免构建中途失败；
  # 拿到证书后把这里删掉即可自动进入签名 + 公证流程
  identity: null
  # 随包二进制按「平台-架构」命名：universal 构建时 x64 与 arm64 会分别
  # 取到 darwin-x64 / darwin-arm64 两份**内容不同**的二进制，
  # @electron/universal 才能把它们 lipo 成真正的通用二进制
  # （两侧内容若完全相同，它会直接报 "same in both x64 and arm64 builds" 而失败）。
  extraResources:
    - from: vendor/ffmpeg/darwin-${arch}
      to: bin

dmg:
  title: ${productName} ${version}
  icon: build/icon.png
  # 打开 dmg 后把应用图标摆在左边、应用程序文件夹摆在右边，
  # 用户拖一下就装好 —— 这是 macOS 用户最熟悉的安装动作
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 400

# ---------------- Windows ----------------

win:
  # 只出 x64：覆盖市面上的 Intel / AMD 机器；ARM 版 Windows 也能用兼容模式跑。
  # icon 给 png 就行 —— electron-builder 会用内置的图标工具转出多尺寸 .ico
  # （要求原图 ≥256×256，build/icon.png 是 1024×1024）。
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  extraResources:
    - from: vendor/ffmpeg/win32-x64
      to: bin

nsis:
  # 装到当前用户下（不需要管理员权限），并且允许用户自己改安装位置 ——
  # 现场电脑常常只有 C 盘空间紧张，不让改位置会直接卡住。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  # 卸载时**保留**用户数据目录：任务库与报告都在那里，
  # 因为"卸载软件"不等于"不要我的素材记录"。
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  # 免安装单文件：拷到 U 盘/移动硬盘上双击就能跑，现场不用装任何东西。
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

# 解压即用的 zip（第 3 份免安装形态）。名字里带上 -win，
# 免得和 macOS 那份同名 zip 混在一起分不清。
#
# 没有代码签名证书，所以 Windows 首次运行会弹 SmartScreen 的蓝色提示 ——
# 这不是病毒，是"没买签名证书"。安装说明里写清了怎么继续。
